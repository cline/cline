name: mobile-test

on:
    push:
        branches:
            - main
        paths:
            - "apps/mobile/**"
            - "sdk/packages/hub-client/**"
            - "sdk/packages/hub-testkit/**"
            - "sdk/packages/core/**"
            - ".github/workflows/mobile-test.yml"
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - "apps/mobile/**"
            - "sdk/packages/hub-client/**"
            - "sdk/packages/hub-testkit/**"
            - "sdk/packages/core/**"
            - ".github/workflows/mobile-test.yml"
    workflow_call:

permissions:
    contents: read

defaults:
    run:
        working-directory: .

jobs:
    quality-checks:
        runs-on: ubuntu-latest
        name: Quality Checks
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build SDK packages
              run: bun run build:sdk

            - name: Typecheck
              run: bun -F @cline/mobile typecheck

            - name: Lint & Format
              run: bun biome check --diagnostic-level=error apps/mobile/app/ apps/mobile/src/ apps/mobile/scripts/

            - name: Verify design tokens are in sync
              run: bun -F @cline/mobile tokens:check

    test:
        needs: quality-checks
        runs-on: ubuntu-latest
        name: Test
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build SDK packages
              run: bun run build:sdk

            - name: Run mobile tests
              run: bun -F @cline/mobile test

            # The mobile client is a hub-protocol consumer: its fixtures come from
            # the testkit, so a protocol change must fail here too.
            - name: Run hub client and testkit tests
              if: ${{ !cancelled() }}
              run: bun --parallel -F @cline/hub-client -F @cline/hub-testkit test

    export-smoke:
        needs: quality-checks
        strategy:
            fail-fast: false
            matrix:
                platform: [ios, android]
        runs-on: ubuntu-latest
        name: Export Smoke (${{ matrix.platform }})
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build SDK packages
              run: bun run build:sdk

            # Bundles the whole app through Metro without needing native
            # toolchains, so a broken import, a bad Metro/Babel config or an
            # unresolvable workspace dependency fails CI on every platform.
            - name: Expo export (${{ matrix.platform }})
              run: bun -F @cline/mobile export:${{ matrix.platform }}
              env:
                  EXPO_PUBLIC_ENV: staging
                  EXPO_NO_TELEMETRY: "1"
# The platform-neutral Maestro flow lives at apps/mobile/.maestro/connect-smoke.yaml.
# Device-runner automation still needs the repository's EAS/CI signing decision;
# until then `bun -F @cline/mobile e2e:smoke` runs it against a locally installed
# iOS or Android internal build.
