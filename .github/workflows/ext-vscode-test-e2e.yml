name: ext-vscode-test-e2e

on:
    push:
        branches:
            - main
        # Workflow-level paths avoid queuing runners for docs/hub/cli-only changes.
        # Keep in sync with the dorny filter below. Intentionally omits sdk/packages/**
        # so SDK-only PRs pay sdk-test + ext-vscode-test (unit), not the 3-OS e2e matrix.
        paths:
            - "apps/vscode/src/**"
            - "apps/vscode/webview-ui/**"
            - "apps/vscode/proto/**"
            - "apps/vscode/tests/**"
            - "apps/vscode/scripts/**"
            - "apps/vscode/standalone/**"
            - "apps/vscode/assets/**"
            - "apps/vscode/walkthrough/**"
            - "apps/vscode/package.json"
            - "apps/vscode/webview-ui/package.json"
            - "apps/vscode/buf.yaml"
            - "apps/vscode/tsconfig*.json"
            - "apps/vscode/biome.jsonc"
            - "apps/vscode/esbuild.mjs"
            - "apps/vscode/bunfig.toml"
            - "apps/vscode/.vscode-test.mjs"
            - "apps/vscode/.vscodeignore"
            - "apps/vscode/playwright*.ts"
            - "bun.lock"
            - ".github/workflows/ext-vscode-test-e2e.yml"
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]
        paths:
            - "apps/vscode/src/**"
            - "apps/vscode/webview-ui/**"
            - "apps/vscode/proto/**"
            - "apps/vscode/tests/**"
            - "apps/vscode/scripts/**"
            - "apps/vscode/standalone/**"
            - "apps/vscode/assets/**"
            - "apps/vscode/walkthrough/**"
            - "apps/vscode/package.json"
            - "apps/vscode/webview-ui/package.json"
            - "apps/vscode/buf.yaml"
            - "apps/vscode/tsconfig*.json"
            - "apps/vscode/biome.jsonc"
            - "apps/vscode/esbuild.mjs"
            - "apps/vscode/bunfig.toml"
            - "apps/vscode/.vscode-test.mjs"
            - "apps/vscode/.vscodeignore"
            - "apps/vscode/playwright*.ts"
            - "bun.lock"
            - ".github/workflows/ext-vscode-test-e2e.yml"
    workflow_dispatch:
    workflow_call:
        inputs:
            force:
                description: Force e2e regardless of path filters
                type: boolean
                required: false
                default: false
            matrix_mode:
                description: "ubuntu | full — PR default is ubuntu; full runs 3-OS"
                type: string
                required: false
                default: ubuntu

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        name: Detect Changes
        outputs:
            e2e: ${{ steps.force_merge.outputs.run_all == 'true' || steps.filter.outputs.e2e == 'true' }}
        steps:
            # Force full coverage for intentional full runs (manual / label override).
            # Do NOT force on push to main — that made docs merges pay for 3-OS e2e.
            - id: force
              if: github.event_name == 'workflow_dispatch'
              run: echo "run_all=true" >> "$GITHUB_OUTPUT"

            - id: force_call
              if: github.event_name == 'workflow_call' && inputs.force
              run: echo "run_all=true" >> "$GITHUB_OUTPUT"

            - id: force_merge
              run: |
                  if [ "${{ steps.force.outputs.run_all }}" = "true" ] \
                    || [ "${{ steps.force_call.outputs.run_all }}" = "true" ]; then
                    echo "run_all=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@v4
              if: steps.force_merge.outputs.run_all != 'true'

            - uses: dorny/paths-filter@v3
              if: steps.force_merge.outputs.run_all != 'true'
              id: filter
              with:
                  filters: |
                      e2e:
                          - 'apps/vscode/src/**'
                          - 'apps/vscode/webview-ui/**'
                          - 'apps/vscode/proto/**'
                          - 'apps/vscode/tests/**'
                          - 'apps/vscode/scripts/**'
                          - 'apps/vscode/standalone/**'
                          - 'apps/vscode/assets/**'
                          - 'apps/vscode/walkthrough/**'
                          - 'apps/vscode/package.json'
                          - 'apps/vscode/webview-ui/package.json'
                          # Root bun lockfile is authoritative for the whole workspace (incl. apps/vscode).
                          - 'bun.lock'
                          - 'apps/vscode/buf.yaml'
                          - 'apps/vscode/tsconfig*.json'
                          - 'apps/vscode/biome.jsonc'
                          - 'apps/vscode/esbuild.mjs'
                          - 'apps/vscode/bunfig.toml'
                          - 'apps/vscode/.vscode-test.mjs'
                          - 'apps/vscode/.vscodeignore'
                          - 'apps/vscode/playwright*.ts'
                          - '.github/workflows/ext-vscode-test-e2e.yml'

    matrix_prep:
        needs: detect-changes
        if: needs.detect-changes.outputs.e2e == 'true'
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - id: set-matrix
              run: |
                  # Combined policy (#51 label/workflow_call overrides + #52 macOS PR coverage):
                  # - full / push / dispatch / ci/e2e-full → ubuntu+windows+macos
                  # - pull_request default → ubuntu+macos (cache recovery coverage; windows stays off PRs)
                  # - workflow_call matrix_mode=ubuntu → ubuntu only
                  MODE="${{ github.event_name == 'workflow_call' && inputs.matrix_mode || '' }}"
                  if [ "$MODE" = "full" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo 'matrix=[{"runner":"ubuntu"},{"runner":"windows"},{"runner":"macos"}]' >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ contains(github.event.pull_request.labels.*.name, 'ci/e2e-full') }}" = "true" ]; then
                    echo 'matrix=[{"runner":"ubuntu"},{"runner":"windows"},{"runner":"macos"}]' >> "$GITHUB_OUTPUT"
                  elif [ "$MODE" = "ubuntu" ]; then
                    echo 'matrix=[{"runner":"ubuntu"}]' >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
                    echo 'matrix=[{"runner":"ubuntu"},{"runner":"macos"}]' >> "$GITHUB_OUTPUT"
                  else
                    echo 'matrix=[{"runner":"ubuntu"},{"runner":"windows"},{"runner":"macos"}]' >> "$GITHUB_OUTPUT"
                  fi

    e2e:
        needs: [detect-changes, matrix_prep]
        if: needs.detect-changes.outputs.e2e == 'true'
        strategy:
            fail-fast: true
            matrix:
                include: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
        runs-on: ${{ matrix.runner }}-latest
        timeout-minutes: 20
        permissions:
            id-token: write
            contents: read
        defaults:
            run:
                working-directory: apps/vscode
        steps:
            - uses: actions/checkout@v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            # Cache Bun's global install cache - keyed on the authoritative root bun.lock.
            - name: Cache Bun install cache
              uses: actions/cache@v4
              id: bun-cache
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            # Cache VS Code installation.
            # Key suffix code-bin-v1: VS Code >=1.110 renamed Contents/MacOS/Electron
            # to Contents/MacOS/Code; old caches + @vscode/test-electron@2.x looked for
            # Electron and failed with ENOENT. Paired with test-electron@3.1.0.
            - name: Cache VS Code
              uses: actions/cache@v4
              id: vscode-cache
              with:
                  path: apps/vscode/.vscode-test
                  key: vscode-${{ runner.os }}-stable-code-bin-v1-${{ hashFiles('apps/vscode/.vscode-test.mjs', 'apps/vscode/package.json') }}
                  restore-keys: |
                      vscode-${{ runner.os }}-stable-code-bin-v1-

            # actions/cache can restore an incomplete VS Code tree. Drop it so
            # downloadAndUnzipVSCode re-fetches instead of trusting COMPLETE alone.
            - name: Validate cached VS Code Electron
              shell: bash
              # defaults.working-directory is apps/vscode — use a path relative to that.
              run: |
                  set -euo pipefail
                  ROOT=".vscode-test"
                  if [ ! -d "$ROOT" ]; then
                    echo "No VS Code cache directory; download will populate it."
                    exit 0
                  fi
                  case "${{ runner.os }}" in
                    macOS)
                      # VS Code >=1.110 ships Contents/MacOS/Code; older builds used Electron.
                      ELECTRON=$(find "$ROOT" \( -path '*/Contents/MacOS/Code' -o -path '*/Contents/MacOS/Electron' \) -type f 2>/dev/null | head -n 1 || true)
                      ;;
                    Windows)
                      ELECTRON=$(find "$ROOT" -name 'Code.exe' -type f 2>/dev/null | head -n 1 || true)
                      ;;
                    *)
                      ELECTRON=$(find "$ROOT" -type f \( -name 'code' -o -name 'code-insiders' \) 2>/dev/null | head -n 1 || true)
                      ;;
                  esac
                  if [ -z "${ELECTRON}" ] || [ ! -f "${ELECTRON}" ]; then
                    echo "Cached VS Code is incomplete (missing Electron/code binary); clearing $ROOT"
                    rm -rf "$ROOT"
                  else
                    echo "Cached VS Code executable OK: $ELECTRON"
                  fi

            # Cache Playwright browsers
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: |
                      ~/.cache/ms-playwright
                      ~/Library/Caches/ms-playwright
                      ~/AppData/Local/ms-playwright
                  key: playwright-browsers-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      playwright-browsers-${{ runner.os }}-

            # Single root install resolves the entire bun workspace at once (replaces
            # the per-package `npm ci` steps for apps/vscode + webview-ui).
            - name: Install workspace dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # @cline/* are local workspace symlinks to source packages; build dist/
            # before building/packaging the extension for E2E.
            - name: Build SDK packages
              working-directory: ${{ github.workspace }}
              run: bun run build:sdk

            - name: Assert better-sqlite3 native binary present
              # Force bash: the Windows runner defaults to pwsh, which can't parse this
              # POSIX test. Git Bash ships on GitHub's windows-latest images.
              shell: bash
              run: |
                  NODE_FILE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
                  if [ ! -f "$NODE_FILE" ]; then
                    echo "ERROR: better-sqlite3 native binary missing at apps/vscode/$NODE_FILE"
                    echo "(bun trustedDependencies postinstall likely did not run)"
                    exit 1
                  fi
                  echo "Found better-sqlite3 native binary: $NODE_FILE"

            # NOTE: vsce is no longer installed globally. @vscode/vsce is a workspace
            # devDependency of apps/vscode (resolved into node_modules/.bin), and the
            # `test:e2e:build` script invokes `vsce` via `bun run`, which puts the local
            # .bin on PATH. No global install needed.

            - name: Install xvfb on Linux
              if: matrix.runner == 'ubuntu'
              run: sudo apt-get update && sudo apt-get install -y xvfb

            # Run optimized E2E tests (eliminates redundant builds)
            - name: Run E2E tests - Linux
              if: matrix.runner == 'ubuntu'
              run: xvfb-run -a bun run test:e2e:optimal

            - name: Run E2E tests - Non-Linux
              if: matrix.runner != 'ubuntu'
              run: bun run test:e2e:optimal

            - uses: actions/upload-artifact@v4
              if: ${{ failure() }}
              with:
                  name: playwright-recordings-${{ matrix.runner }}
                  path: |
                      test-results/playwright/
