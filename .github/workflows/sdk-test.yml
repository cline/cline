name: sdk-test

on:
    push:
        branches:
            - main
        paths:
            - "sdk/**"
            - ".github/workflows/sdk-test.yml"
            - ".github/actions/setup-bun-workspace/**"
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - "sdk/**"
            - ".github/workflows/sdk-test.yml"
            - ".github/actions/setup-bun-workspace/**"
    workflow_call:

permissions:
    contents: read

concurrency:
    group: sdk-test-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: .

jobs:
    # Fail-fast gate: cheap lint before the heavy typecheck/build.
    quality-checks:
        runs-on: ubuntu-latest
        name: Quality Checks
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace
              with:
                  bun-version: "1.3.13"

            # Lint/format first so format failures abort before ~2 min of typecheck.
            - name: Lint & Format
              run: bun run lint

            - name: Typecheck
              run: |
                  bun run build:sdk
                  bun run -F @cline/cli build
                  bun run types

    matrix_prep:
        needs: quality-checks
        runs-on: ubuntu-latest
        name: Test matrix
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - id: set-matrix
              run: |
                  # PRs: Ubuntu only (Windows cold install was 4–5 min of wall clock).
                  # push / workflow_dispatch / workflow_call (ci/sdk force): Ubuntu + Windows.
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    echo 'matrix=[{"os":"ubuntu-latest","node-version":"24.x"}]' >> "$GITHUB_OUTPUT"
                  else
                    echo 'matrix=[{"os":"ubuntu-latest","node-version":"24.x"},{"os":"windows-latest","node-version":"24.x"}]' >> "$GITHUB_OUTPUT"
                  fi

    # OS matrix. fail-fast cancels the sibling OS when one fails.
    test:
        needs: [quality-checks, matrix_prep]
        strategy:
            fail-fast: true
            matrix:
                include: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
        runs-on: ${{ matrix.os }}
        name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace
              with:
                  bun-version: "1.3.13"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Build SDK
              id: build_sdk_step
              run: bun run build:sdk

            - name: Build CLI
              id: build_cli_step
              run: bun -F @cline/cli build

            - name: Run Tests
              if: matrix.os != 'windows-latest'
              run: bun run test

            - name: Run SDK Tests (Windows)
              if: matrix.os == 'windows-latest'
              run: bun -F './sdk/packages/**' test

            - name: Smoke test SQLite under Node
              if: matrix.os != 'windows-latest'
              timeout-minutes: 10
              run: bun sdk/scripts/ci-node-smoke.ts

    # Parallel with the OS test matrix so TUI e2e does not serialize behind unit tests.
    tui-and-publish:
        needs: quality-checks
        runs-on: ubuntu-latest
        name: TUI e2e + publish check
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun workspace
              uses: ./.github/actions/setup-bun-workspace
              with:
                  bun-version: "1.3.13"

            - name: Build SDK
              run: bun run build:sdk

            - name: Build CLI
              run: bun -F @cline/cli build

            - name: Run TUI e2e tests
              run: bun -F @cline/cli test:e2e:cli:tui

            - name: Verify packages are publishable
              run: bun sdk/scripts/check-publish.ts
