name: apply-neuronpool-builtin
on:
  push:
    branches: [neuronpool-builtin]
    paths:
      - scripts/apply-neuronpool-builtin.py
      - .github/workflows/apply-neuronpool-builtin.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert NeuronPool builtin
        run: python3 scripts/apply-neuronpool-builtin.py
      - name: Commit patch and remove applicator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/packages/llms/src/providers/builtins.ts
          git rm -f scripts/apply-neuronpool-builtin.py .github/workflows/apply-neuronpool-builtin.yml
          git commit -m "feat(llms): add NeuronPool OpenAI-compatible builtin"
          git push
