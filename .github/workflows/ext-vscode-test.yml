name: ext-vscode-test

on:
    push:
        branches:
            - main
    workflow_dispatch:
    pull_request:
        branches:
            - main
    workflow_call:

permissions:
    contents: read
    pull-requests: read

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            vscode: ${{ steps.force.outputs.run_all == 'true' || steps.filter.outputs.vscode == 'true' }}
        steps:
            - id: force
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
              run: echo "run_all=true" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v4
              if: steps.force.outputs.run_all != 'true'

            - uses: dorny/paths-filter@v3
              if: steps.force.outputs.run_all != 'true'
              id: filter
              with:
                  filters: |
                      vscode:
                          - 'apps/vscode/**'
                          - 'sdk/packages/**'
                          - 'package.json'
                          - 'bun.lock'
                          - '.github/workflows/ext-vscode-test.yml'

    quality-checks:
        needs: detect-changes
        if: needs.detect-changes.outputs.vscode == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/vscode
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13
            - name: Install workspace dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Build SDK packages
              working-directory: ${{ github.workspace }}
              run: bun run build:sdk
            - name: Run quality checks
              run: bun run ci:check-all

    vscode-test:
        needs: [detect-changes, quality-checks]
        if: needs.detect-changes.outputs.vscode == 'true'
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
                working-directory: apps/vscode
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13
            - name: Install workspace dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Build SDK packages
              working-directory: ${{ github.workspace }}
              run: bun run build:sdk
            - name: Build extension and tests
              run: bun run ci:build
            - name: Run Vitest suites
              run: bun run test:vitest
            - name: Run Bun unit suites
              run: bun run test:unit
            - name: Run extension integration tests
              if: runner.os != 'Linux'
              run: bun run test:integration
            - name: Run extension integration tests
              if: runner.os == 'Linux'
              run: xvfb-run -a bun run test:integration

    test:
        needs: [detect-changes, quality-checks, vscode-test]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        steps:
            - name: Verify selected test jobs
              env:
                  VSCODE_CHANGED: ${{ needs.detect-changes.outputs.vscode }}
                  QUALITY_RESULT: ${{ needs.quality-checks.result }}
                  TEST_RESULT: ${{ needs.vscode-test.result }}
              run: |
                  if [ "$VSCODE_CHANGED" != "true" ]; then
                    exit 0
                  fi
                  test "$QUALITY_RESULT" = "success"
                  test "$TEST_RESULT" = "success"
