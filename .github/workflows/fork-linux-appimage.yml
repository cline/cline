name: fork-linux-appimage

# Unofficial Linux Type 2 AppImages for this fork only (x64 + aarch64).
# Official desktop-publish cannot run here. No signing secrets are required.
on:
  push:
    branches:
      - fork-linux-appimage-release
  workflow_dispatch:

concurrency:
  group: fork-linux-appimage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Linux ${{ matrix.arch }} AppImage
    if: github.repository == '3ddruck12/cline'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            appimagetool: appimagetool-x86_64.AppImage
            runtime: runtime-x86_64
            tool_arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            appimagetool: appimagetool-aarch64.AppImage
            runtime: runtime-aarch64
            tool_arch: aarch64
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/examples/desktop-app/src-tauri -> target

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            upx-ucl \
            wget

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK packages
        run: bun run build:sdk

      - name: Ignore ldd on Bun sidecar binaries
        run: |
          sudo mv /usr/bin/ldd /usr/bin/ldd.real
          sudo tee /usr/bin/ldd >/dev/null <<'EOF'
          #!/bin/bash
          for arg in "$@"; do
            [ -f "$arg" ] || continue
            case "$(basename -- "$arg")" in
              code-sidecar|code-sidecar-*|cline-remote-helper-*)
                printf '\tnot a dynamic executable\n'
                exit 0
                ;;
            esac
          done
          exec /usr/bin/ldd.real "$@"
          EOF
          sudo chmod 755 /usr/bin/ldd

      # linuxdeploy's bundled/system patchelf rewrites Bun --compile ELFs
      # (extra PT_LOAD for RUNPATH). ld-linux then segfaults before main(),
      # so the desktop backend never publishes its websocket endpoint.
      - name: Do not patchelf Bun sidecar binaries
        run: |
          if [ -x /usr/bin/patchelf ] && [ ! -x /usr/bin/patchelf.real ]; then
            sudo mv /usr/bin/patchelf /usr/bin/patchelf.real
          fi
          sudo tee /usr/bin/patchelf >/dev/null <<'EOF'
          #!/bin/bash
          for arg in "$@"; do
            [ -f "$arg" ] || continue
            case "$(basename -- "$arg")" in
              code-sidecar|code-sidecar-*|cline-remote-helper-*)
                echo "patchelf: skipping bun binary $arg" >&2
                exit 0
                ;;
            esac
          done
          exec /usr/bin/patchelf.real "$@"
          EOF
          sudo chmod 755 /usr/bin/patchelf

      - name: Build AppImage
        working-directory: apps/examples/desktop-app
        run: bunx tauri build --bundles appimage --verbose

      - name: Repack as AppImage Type 2
        working-directory: apps/examples/desktop-app
        env:
          TOOL_ARCH: ${{ matrix.tool_arch }}
          APPIMAGETOOL: ${{ matrix.appimagetool }}
          RUNTIME: ${{ matrix.runtime }}
          ARCH_SUFFIX: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          APPDIR=$(find "$BUNDLE_DIR" -maxdepth 1 -type d -name '*.AppDir' -print -quit)
          if [ -z "$APPDIR" ]; then
            echo "no AppDir produced under $BUNDLE_DIR"
            find "$BUNDLE_DIR" -maxdepth 2 | head -50
            exit 1
          fi

          # linuxdeploy still ships its own patchelf; replace any rewritten
          # Bun ELFs with the untouched compile output before packing.
          ORIG=$(find src-tauri/bin -maxdepth 1 -type f -name 'code-sidecar-*' | head -1)
          if [ -z "$ORIG" ]; then
            echo "original sidecar missing under src-tauri/bin"
            ls -la src-tauri/bin || true
            exit 1
          fi
          shopt -s nullglob
          RESTORED=0
          for dest in "$APPDIR/usr/bin/code-sidecar" "$APPDIR"/usr/bin/code-sidecar-*; do
            [ -f "$dest" ] || continue
            cp -f "$ORIG" "$dest"
            chmod +x "$dest"
            RESTORED=$((RESTORED + 1))
          done
          if [ "$RESTORED" -eq 0 ]; then
            echo "no code-sidecar in AppDir to restore"
            find "$APPDIR" -name 'code-sidecar*' | head
            exit 1
          fi
          HELPER_SRC="src-tauri/bin/remote-helpers"
          if [ -d "$HELPER_SRC" ]; then
            while IFS= read -r dest; do
              name=$(basename -- "$dest")
              if [ -f "$HELPER_SRC/$name" ]; then
                cp -f "$HELPER_SRC/$name" "$dest"
                chmod +x "$dest"
              fi
            done < <(find "$APPDIR" -type f -name 'cline-remote-helper-*')
          fi
          if readelf -d "$APPDIR/usr/bin/code-sidecar" | grep -q 'RPATH\|RUNPATH'; then
            echo "restored sidecar still has RPATH/RUNPATH; refusing to pack a broken binary"
            readelf -d "$APPDIR/usr/bin/code-sidecar"
            exit 1
          fi
          env -u LD_LIBRARY_PATH -u APPDIR -u APPIMAGE \
            "$APPDIR/usr/bin/code-sidecar" --telemetry-selfcheck

          TOOLS="$RUNNER_TEMP/appimage-type2"
          mkdir -p "$TOOLS"
          curl -fsSL -o "$TOOLS/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/${APPIMAGETOOL}"
          curl -fsSL -o "$TOOLS/runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/${RUNTIME}"
          chmod +x "$TOOLS/appimagetool"

          OUT="dist/publish"
          mkdir -p "$OUT"
          NAME="Cline_${VERSION}_${ARCH_SUFFIX}.AppImage"
          DEST="$OUT/$NAME"

          ARCH="$TOOL_ARCH" "$TOOLS/appimagetool" \
            --no-appstream \
            --runtime-file "$TOOLS/runtime" \
            "$APPDIR" \
            "$DEST"
          chmod +x "$DEST"

          MAGIC=$(od -An -tx1 -N 3 -j 8 "$DEST" | tr -d ' \n')
          echo "AppImage magic at offset 8: $MAGIC"
          if [ "$MAGIC" != "414902" ]; then
            echo "expected Type 2 magic 41 49 02, got $MAGIC"
            exit 1
          fi

          ls -lh "$DEST"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          retention-days: 30
          path: apps/examples/desktop-app/dist/publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.repository == '3ddruck12/cline' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          path: dist/desktop
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(dist/desktop/*.AppImage)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no AppImage artifacts downloaded"
            ls -la dist/desktop || true
            exit 1
          fi
          VERSION=$(printf '%s\n' "${FILES[@]}" | sed -n 's|.*/Cline_\(.*\)_.*\.AppImage|\1|p' | head -1)
          if [ -z "$VERSION" ]; then
            echo "could not parse version from ${FILES[*]}"
            exit 1
          fi
          TAG="linux-appimage-v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          NOTES=$(cat <<EOF
          Unofficial Linux Type 2 AppImages (static type2-runtime, no libfuse2).

          This is **not** an official Cline release.

          | File | Arch |
          | --- | --- |
          | \`Cline_${VERSION}_amd64.AppImage\` | x86_64 |
          | \`Cline_${VERSION}_aarch64.AppImage\` | ARM64 |

          \`\`\`bash
          chmod +x Cline_${VERSION}_amd64.AppImage
          ./Cline_${VERSION}_amd64.AppImage
          \`\`\`

          Source: ${GITHUB_SHA}
          EOF
          )
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cline Desktop Linux AppImage v${VERSION}" \
            --notes "$NOTES"
          ls -lh "${FILES[@]}"
