name: ext-vscode-publish-nightly

on:
  # Manual dispatch only. The PublishNightly environment has required reviewers,
  # so unattended scheduled runs wait for approval and block later nightlies.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and upload the .vsix artifact without publishing or tagging"
        required: false
        default: false
        type: boolean

run-name: "Publish Nightly from ${{ github.ref_name }} @ ${{ github.sha }}"

# Nightly versions use a seconds-resolution timestamp, so concurrent runs from
# the same ref could otherwise collide in the marketplaces.
concurrency:
  group: ext-vscode-publish-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    if: github.repository == 'cline/cline'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ext-vscode-test.yml

  publish:
    needs: test
    permissions:
      contents: write
    name: Publish Cline (Nightly) Extension
    # The PublishNightly environment's deployment-branch policy is the enforced
    # boundary; this check provides defense in depth for the checked-in workflow.
    if: github.repository == 'cline/cline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: PublishNightly
    defaults:
      run:
        working-directory: apps/vscode

    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - name: Show build source
        working-directory: ${{ github.workspace }}
        run: |
          echo "Building ref: $GITHUB_REF"
          echo "Building sha: $GITHUB_SHA"
          git --no-pager log -1 --oneline

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The publisher and VSCE run on Node. Node 22 also avoids npm 11
      # dependency-detection failures seen with vsce on newer runtimes.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      # @cline/* packages resolve through their built dist directories.
      - name: Build SDK packages
        working-directory: ${{ github.workspace }}
        run: bun run build:sdk

      - name: Assert better-sqlite3 native binary present
        run: |
          NODE_FILE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if [ ! -f "$NODE_FILE" ]; then
            echo "ERROR: better-sqlite3 native binary missing at apps/vscode/$NODE_FILE"
            echo "(bun trustedDependencies postinstall likely did not run)"
            exit 1
          fi
          echo "Found better-sqlite3 native binary: $NODE_FILE"

      - name: Verify marketplace token
        if: inputs.dry-run != true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "Error: VSCE_PAT is required to publish."
            exit 1
          fi

      - name: Package and publish nightly extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          CLINE_ENVIRONMENT: production
          TELEMETRY_SERVICE_API_KEY: ${{ secrets.TELEMETRY_SERVICE_API_KEY }}
          ERROR_SERVICE_API_KEY: ${{ secrets.ERROR_SERVICE_API_KEY }}
          # OpenTelemetry production defaults (can be overridden at runtime)
          OTEL_TELEMETRY_ENABLED: ${{ secrets.OTEL_TELEMETRY_ENABLED }}
          OTEL_LOGS_EXPORTER: otlp
          OTEL_METRICS_EXPORTER: otlp
          OTEL_TRACES_EXPORTER: otlp
          CLINE_TRACE_RECORD_CONTENT: "true"
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            bun run publish:marketplace:nightly -- --dry-run
          else
            bun run publish:marketplace:nightly
          fi

      # Read the authoritative version from the artifact. This avoids duplicating
      # the publisher's timestamp calculation in workflow state.
      - name: Read packaged version
        id: package
        run: |
          VERSION=$(unzip -p dist/cline-nightly.vsix extension/package.json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => console.log(JSON.parse(s).version))')
          if [[ -z "$VERSION" ]]; then
            echo "Error: packaged extension version is empty."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaged saoudrizwan.cline-nightly@$VERSION"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-nightly-${{ steps.package.outputs.version }}
          path: apps/vscode/dist/cline-nightly.vsix
          if-no-files-found: error

      - name: Tag published commit
        if: inputs.dry-run != true
        # Publishing has already succeeded if this best-effort bookkeeping step
        # fails because the default token cannot tag commits that alter workflows.
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SAFE_REF=$(echo "$GITHUB_REF_NAME" | tr '/[:upper:]' '-[:lower:]' | tr -cd 'a-z0-9._-')
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          TAG="nightly-${SAFE_REF}-${TIMESTAMP}-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Cline Nightly published from ${GITHUB_REF_NAME} at ${GITHUB_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

          echo "Tagged published commit: $TAG"
