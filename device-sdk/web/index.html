<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
	<meta name="theme-color" content="#14121f">
	<title>Cline Device</title>
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main id="app" data-state="offline">
		<header class="bar">
			<span id="counters" class="counters" aria-label="Sessions"></span>
			<div id="menu-wrap" class="menu-wrap">
				<button id="menu-button" class="icon-btn" type="button" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">
					<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
				</button>
				<div id="menu" class="menu" role="menu" hidden>
					<button id="menu-new" class="menu-item" type="button" role="menuitem">New session</button>
					<button id="menu-unpair" class="menu-item danger" type="button" role="menuitem">Unpair</button>
				</div>
			</div>
		</header>

		<section class="stage">
			<p id="status" class="status" role="status" hidden></p>
			<div id="speech" class="speech" role="status" hidden>
				<span id="speech-kind" class="label"></span>
				<p id="speech-text"></p>
			</div>
			<button id="avatar" class="avatar" type="button" aria-label="Cline Device. Tap for stats.">
				<img id="sprite" alt="" draggable="false">
				<span id="bubble" class="bubble" hidden>!</span>
			</button>

			<div id="info" class="info" aria-live="polite">
				<span id="label" class="label">CONNECTING</span>
				<p id="text" class="text"></p>
			</div>

			<div id="bridge-help" class="bridge-help" hidden>
				<p>Run this from the Cline repo on your laptop:</p>
				<code>Open the Cline dashboard and choose Pair device</code>
			</div>
			<div class="controls">
				<div id="session-actions" class="row" hidden>
					<button id="new-session" class="btn" type="button" aria-label="Start a new session"><span aria-hidden="true">＋</span> New session</button>
					<button id="stop-session" class="btn stop" type="button" hidden><span aria-hidden="true">■</span> Stop</button>
				</div>
				<!-- Pairing (first run, or after the token is revoked) -->
				<form id="pair" class="pair" hidden>
					<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" aria-label="Pairing code" required>
					<button type="submit" class="btn primary">Pair</button>
					<p class="hint">Get a code with <code>start&nbsp;--&nbsp;--pair</code> on your laptop.</p>
				</form>

				<div id="approval" class="row" hidden>
					<button id="approve" class="btn primary" type="button">Approve</button>
					<button id="deny" class="btn" type="button">Deny</button>
				</div>

				<div id="confirm" class="row" hidden>
					<button id="voice-cancel" class="btn" type="button">Cancel</button>
					<button id="voice-send" class="btn primary" type="button">Send <span id="countdown"></span></button>
				</div>

				<div id="talk" class="talk-wrap">
					<button id="mic" class="btn talk" type="button" aria-label="Hold to talk">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9h-2Z"/></svg>
						<span id="mic-label">Hold to talk</span>
					</button>
					<button id="new-off" class="chip" type="button" hidden>New session ✕</button>
				</div>
			</div>
		</section>

	</main>
	<script src="app.js"></script>
</body>
</html>
