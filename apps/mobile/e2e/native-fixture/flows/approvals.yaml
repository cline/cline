# Precondition: a fresh UI-created fixture Cloud chat with registered approvals.
# Create it after any fixture-server restart; restored history alone is insufficient.
# These deterministic tools never run OS commands.
appId: bot.cline.app.e2e
name: Deterministic Cloud approval grant and reasoned denial
---
- tapOn: "Message composer"
- inputText: "approval-fixture"
- tapOn: "Send"
- assertVisible: "Tool approval required"
- assertVisible: "Waiting for approval"
- assertVisible: "git diff -- src/Example.tsx"
- tapOn: "Approve"
- assertVisible: "Approval fixture finished.*"
- tapOn: "Message composer"
- inputText: "approval-fixture"
- tapOn: "Send"
- assertVisible: "Tool approval required"
- assertVisible: "Waiting for approval"
- assertVisible: "git diff -- src/Example.tsx"
- tapOn: "Deny"
- tapOn: "Denial reason"
- inputText: "Native denial fixture"
- tapOn: "Confirm deny"
- assertVisible: "Tool Denied: command git diff -- src/Example.tsx.*"
- assertVisible: "1 tool call denied"
- takeScreenshot: fixture-approval-denied
