[package]
name = "cline-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = ["image-png", "tray-icon"] }
notify-rust = "4.18"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }
# gtk3 instead of the default xdg-portal backend on Linux: the portal needs a
# D-Bus session and an xdg-desktop-portal backend, and when either is missing
# pick_folder() returns None, which the app reads as "cancelled". The app is a
# GTK window already, so the GTK dialog works wherever the app runs. The
# feature is a no-op on macOS and Windows.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
