services:
  cline-bots:
    build:
      context: ../../..
      dockerfile: apps/cline/docker/Dockerfile
    image: cline-bots-gateway:dev
    restart: unless-stopped
    environment:
      CLINE_GATEWAY_DOMAIN: ${CLINE_GATEWAY_DOMAIN:?Set CLINE_GATEWAY_DOMAIN in .env}
      CLINE_CADDY_SITE_ADDRESS: ${CLINE_CADDY_SITE_ADDRESS:-}
      CLINE_GATEWAY_LEAD_PROFILE: ${CLINE_GATEWAY_LEAD_PROFILE:-cline}
      CLINE_SIDECAR_TRUSTED_ORIGINS: ${CLINE_SIDECAR_TRUSTED_ORIGINS:-https://cline-gateway-connect.cline-8362.chatgpt.site}
    ports:
      - "${CLINE_BIND_ADDRESS:-0.0.0.0}:${CLINE_HTTP_PORT:-80}:8080"
      - "${CLINE_BIND_ADDRESS:-0.0.0.0}:${CLINE_HTTPS_PORT:-443}:8443"
    volumes:
      - cline-data:/data
      - cline-workspaces:/workspaces

volumes:
  cline-data:
  cline-workspaces:
