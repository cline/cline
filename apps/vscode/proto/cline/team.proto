syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service TeamService {
  rpc getTeamBoard(EmptyRequest) returns (TeamBoard);
  rpc createTeamTask(CreateTeamTaskRequest) returns (TeamTask);
  rpc updateTeamTask(UpdateTeamTaskRequest) returns (TeamTask);
  rpc cancelTeamRun(CancelTeamRunRequest) returns (TeamRun);
  rpc subscribeToTeamBoard(EmptyRequest) returns (stream TeamBoard);
}

message TeamTask {
  string id = 1;
  string title = 2;
  string status = 3;
  optional string description = 4;
  optional string parent_task_id = 5;
  optional string assigned_agent_id = 6;
  optional string session_id = 7;
  optional string worktree_path = 8;
  optional string branch = 9;
  optional string summary = 10;
  optional string blocker = 11;
  string created_at = 12;
  string updated_at = 13;
  uint32 revision = 14;
  string created_by = 15;
  repeated string depends_on = 16;
}

message TeamAgent {
  string agent_id = 1;
  string display_label = 2;
  string role = 3;
  string status = 4;
  optional string description = 5;
  optional string parent_agent_id = 6;
  optional string parent_task_id = 7;
  optional string current_task_id = 8;
  optional string run_status = 9;
  optional string session_id = 10;
  optional string worktree_path = 11;
  optional string branch = 12;
  string last_activity_at = 13;
  optional string outcome = 14;
}

message TeamRun {
  string id = 1;
  string agent_id = 2;
  optional string task_id = 3;
  string status = 4;
  string started_at = 5;
  optional string ended_at = 6;
  optional string current_activity = 7;
  optional string error = 8;
}

message TeamBoard {
  uint32 version = 1;
  string team_id = 2;
  string team_name = 3;
  uint32 revision = 4;
  string updated_at = 5;
  repeated TeamTask tasks = 6;
  repeated TeamAgent agents = 7;
  repeated TeamRun runs = 8;
  optional string error = 9;
}

message CreateTeamTaskRequest {
  Metadata metadata = 1;
  string title = 2;
  optional string description = 3;
  optional string parent_task_id = 4;
  optional string assigned_agent_id = 5;
  optional string session_id = 6;
  optional string worktree_path = 7;
  optional string branch = 8;
}

message UpdateTeamTaskRequest {
  Metadata metadata = 1;
  string task_id = 2;
  optional uint32 expected_revision = 3;
  optional string title = 4;
  optional string description = 5;
  optional string status = 6;
  optional string parent_task_id = 7;
  optional string assigned_agent_id = 8;
  optional string session_id = 9;
  optional string worktree_path = 10;
  optional string branch = 11;
  optional string summary = 12;
  optional string blocker = 13;
  bool clear_parent_task = 14;
  bool clear_assigned_agent = 15;
  bool clear_session = 16;
  bool clear_worktree = 17;
  bool clear_branch = 18;
  bool clear_summary = 19;
  bool clear_blocker = 20;
  bool clear_description = 21;
}

message CancelTeamRunRequest {
  Metadata metadata = 1;
  string run_id = 2;
  optional string reason = 3;
}
