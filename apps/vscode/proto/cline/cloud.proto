syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

// Cline Cloud sessions: run a task in a hosted sandbox instead of the local workspace.
service CloudService {
  // GitHub App connection status and the repositories it can access, for the active account scope.
  // Cached per account; `refresh` re-asks the control plane.
  rpc getGitHubConnection(GitHubConnectionRequest) returns (GitHubConnection);
  // Opens the GitHub App install / manage-access page in the browser
  rpc connectGitHub(EmptyRequest) returns (Empty);
  // Lists branches of an accessible repository
  rpc getRepositoryBranches(RepositoryBranchesRequest) returns (CloudBranchList);
  // Records one user choice about where new tasks run: Local/Cloud, a repository, or a branch
  rpc chooseCloudTaskTarget(CloudTaskTargetChoice) returns (Empty);
  // Opens the Cline Cloud dashboard page for a cloud session
  rpc openCloudSessionDashboard(StringRequest) returns (Empty);
  // Resolves live agent status for only the cloud sessions currently displayed
  rpc resolveCloudSessionStatuses(CloudSessionStatusRequest) returns (CloudSessionStatusList);
}

message GitHubRepository {
  int64 id = 1;
  string name = 2;
  string full_name = 3;
  string url = 4;
  string default_branch = 5;
}

message GitHubConnectionRequest {
  Metadata metadata = 1;
  bool refresh = 2;
}

message GitHubConnection {
  bool signed_in = 1;
  bool connected = 2;
  string connect_url = 3;
  repeated GitHubRepository repositories = 4;
  // Set when the request failed (network / API error); other fields are then unreliable
  optional string error = 5;
}

message RepositoryBranchesRequest {
  Metadata metadata = 1;
  int64 repository_id = 2;
  optional string query = 3;
}

message CloudBranchList {
  repeated string branches = 1;
}

// Exactly one field is set: the choice the user just made. Choosing a
// repository forgets the branch chosen for the previous one.
message CloudTaskTargetChoice {
  Metadata metadata = 1;
  oneof choice {
    // "local" | "cloud"
    string target = 2;
    int64 repository_id = 3;
    string branch = 4;
  }
}

message CloudSessionStatusRequest {
  Metadata metadata = 1;
  repeated string session_ids = 2;
}

message CloudSessionStatusItem {
  string session_id = 1;
  string status = 2;
}

message CloudSessionStatusList {
  repeated CloudSessionStatusItem statuses = 1;
}
