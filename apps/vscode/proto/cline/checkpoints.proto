syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service CheckpointsService {
  rpc checkpointRestore(CheckpointRestoreRequest) returns (Empty);
  // Opens a multi-file diff of everything that changed between the latest
  // checkpoint (snapshotted when the user's last message started a run) and
  // the current working tree.
  rpc checkpointViewLatestChanges(EmptyRequest) returns (Empty);
  // Returns how many files changed between the latest checkpoint and the
  // current working tree (0 when no checkpoint exists). Used to enable the
  // "View Changes" button only when there is something to show.
  rpc checkpointLatestChangesCount(EmptyRequest) returns (Int64);
  // Reports whether Reset Code can restore the workspace from the user
  // message with the given ts, and if not, why not. Asked when the user opens
  // a message for editing, so the answer reflects the checkpoints that exist
  // right then.
  rpc checkpointExistsForMessage(Int64Request) returns (CheckpointExistsForMessageResponse);
}

// Why Reset Code cannot restore the workspace from a user message. Kept in
// sync with the webview's WorkspaceRestoreAvailability reasons.
enum CheckpointUnavailableReason {
  CHECKPOINT_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  // Checkpoints are disabled in settings right now.
  CHECKPOINT_UNAVAILABLE_REASON_CHECKPOINTS_DISABLED = 1;
  // The workspace was not a git repository when the turn ran, so no
  // checkpoint could be taken. Initializing git enables future checkpoints.
  CHECKPOINT_UNAVAILABLE_REASON_NO_GIT_REPOSITORY = 2;
  // Checkpoint creation was attempted for the turn but failed.
  CHECKPOINT_UNAVAILABLE_REASON_CHECKPOINT_FAILED = 3;
  // The turn's checkpoint could not be located (for example, the transcript
  // no longer maps to it after a reload). No more specific cause is known.
  CHECKPOINT_UNAVAILABLE_REASON_CHECKPOINT_UNAVAILABLE = 4;
}

message CheckpointExistsForMessageResponse {
  bool exists = 1;
  // Set only when exists is false.
  CheckpointUnavailableReason reason = 2;
}

message CheckpointRestoreRequest {
  Metadata metadata = 1;
  int64 number = 2;
  string restore_type = 3;
  optional int64 offset = 4;
}
