syntax = "proto3";

package host;

import "bedrock_coder/common.proto";

option go_package = "github.com/FFFalexgo/AWS_Bedrock_Coder/grpc-go/host";
option java_multiple_files = true;
option java_package = "com.fffalexgo.bedrock_coder.host.proto";

// Provides methods for working with the user's environment.
service EnvService {
  // Writes text to the system clipboard.
  rpc clipboardWriteText(bedrock_coder.StringRequest) returns (bedrock_coder.Empty);

  // Reads text from the system clipboard.
  rpc clipboardReadText(bedrock_coder.EmptyRequest) returns (bedrock_coder.String);

  // Returns the name and version of the host IDE or environment.
  rpc getHostVersion(bedrock_coder.EmptyRequest) returns (GetHostVersionResponse);

  // Returns a URI that will redirect to the host environment.
  // e.g. vscode://fffalexgo.bedrock-coder, idea://, pycharm://, etc.
  // If the host does not support URIs it should return empty.
  rpc getIdeRedirectUri(bedrock_coder.EmptyRequest) returns (bedrock_coder.String);

  // Initiates a graceful shutdown of the host bridge service.
  rpc shutdown(bedrock_coder.EmptyRequest) returns (bedrock_coder.Empty);

  // Logs a debug message to the host environment's log/output console.
  rpc debugLog(bedrock_coder.StringRequest) returns (bedrock_coder.Empty);

  // Opens an external URL in the default browser.
  // In remote environments (VS Code Server, SSH, etc.), this routes the URL
  // to the user's local machine to open in their local browser.
  rpc openExternal(bedrock_coder.StringRequest) returns (bedrock_coder.Empty);
}

message GetHostVersionResponse {
  // The name of the host platform, e.g VSCode, IntelliJ Ultimate Edition, etc.
  optional string platform = 1;
  // The version of the host platform, e.g. 1.103.0 for VSCode, or 2025.1.1.1 for JetBrains IDEs.
  optional string version = 2;
  // The type of the bedrock_coder host environment, e.g. 'VSCode Extension', 'BedrockCoder for JetBrains', 'CLI'
  // This is different from the platform because there are many JetBrains IDEs, but they all use the same
  // plugin.
  optional string bedrock_coder_type = 3;
  // The version of the bedrock_coder host environment, e.g. 33.2.10 for extension, or 1.0.6 for JetBrains.
  optional string bedrock_coder_version = 4;
  // The remote environment name when the host is connected to a remote workspace
  // (for example `ssh-remote`, `dev-container`, or `codespaces`).
  optional string remote_name = 5;
}
