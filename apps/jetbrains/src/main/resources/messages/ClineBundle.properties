settings.cliCommand=Cline CLI command:
settings.cliCommand.comment=Used to run `cline hub ensure --json` when no running hub is found. Accepts a path or a quoted command line.
settings.hubUrl=Hub URL override:
settings.hubUrl.comment=Leave empty to discover the hub automatically (ws://127.0.0.1:25463/hub for installed builds).
settings.authToken=Hub auth token:
settings.authToken.comment=Only needed together with a URL override. Discovered hubs supply their own token.
settings.discoveryPath=Discovery record path:
settings.discoveryPath.comment=Optional path to a hub discovery JSON (same as CLINE_HUB_DISCOVERY_PATH).
settings.group.session=New sessions
settings.provider=Provider ID:
settings.provider.comment=Empty uses the provider last used by the Cline CLI (~/.cline/data/settings/providers.json).
settings.model=Model ID:
settings.model.comment=Empty uses the model configured for that provider in the Cline CLI.
settings.mode=Default mode:
settings.autoApprove=Auto-approve tool calls (yolo mode)
settings.autoApprove.comment=When enabled the hub runs tools without asking; otherwise approvals appear in the tool window.

