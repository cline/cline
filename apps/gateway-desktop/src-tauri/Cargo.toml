[package]
name = "gateway-desktop"
version = "0.0.1"
description = "Gateway Desktop — Phase 3 validation client for the Cline Gateway"
authors = ["Cline Bot Inc."]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[[bin]]
name = "gateway-desktop"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
